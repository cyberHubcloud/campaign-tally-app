name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Accept Android SDK Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install Capacitor dependencies
        run: npm install

      - name: Add Android platform & sync web assets
        run: |
          npx cap add android
          npx cap sync android

      - name: Configure Android permissions for CSV/PDF export
        run: |
          sed -i 's/<application/<uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29" \/>\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" \/>\n    <application android:usesCleartextTraffic="true"/' android/app/src/main/AndroidManifest.xml

      - name: Build Debug APK with Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Campaign Tally APK
        uses: actions/upload-artifact@v4
        with:
          name: Campaign-Tally-Entry-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
